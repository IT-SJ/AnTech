spring.application.name=antech

server.port=8080

# MySQL8 설정
spring.datasource.url=jdbc:mysql://project-db-cgi.smhrd.com:3307/cgi_24K_bigdata26_p3_3?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=cgi_24K_bigdata26_p3_3
spring.datasource.password=smhrd3
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 실행되는 SQL 쿼리 출력
spring.jpa.show-sql=true

# SQL 쿼리를 보기 좋게 포맷팅
spring.jpa.properties.hibernate.format_sql=true

# ddl-auto 옵션 (none, validate, update, create, create-drop 중 선택)
spring.jpa.hibernate.ddl-auto=none

# Hibernate Dialect (MySQL용)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Boot에서 ANSI 컬러 활성화
spring.output.ansi.enabled=ALWAYS

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml

# MyBatis Type Alias 설정 (Model 패키지 경로)
mybatis.type-aliases-package=com.ans.antech.model
