<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modernize Free</title>
    <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 시작 -->
        <aside class="left-sidebar">
            <!-- 사이드바 스크롤-->
            <div>
                <div class="brand-logo d-flex align-items-center justify-content-between">
                    <a href="home" class="text-nowrap logo-img">
                        <img src="../assets/images/logos/Logo1.svg" width="180" alt="" />
                    </a>
                    <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
                        <i class="ti ti-x fs-8"></i>
                    </div>
                </div>
                <!-- 사이드바 네비게이션-->
                <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
                    <ul id="sidebarnav">
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="home" aria-expanded="false">
                                <span>
                                    <i class="ti ti-layout-dashboard"></i>
                                </span>
                                <span class="hide-menu">Home</span>
                            </a>
                        </li>
                        <li class="nav-small-cap">
                            <i class="ti ti-dots nav-small-cap-icon fs-4"></i>
                            <span class="hide-menu">pages</span>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="breaking" aria-expanded="false">
                                <span>
                                    <i class="ti ti-article"></i>
                                </span>
                                <span class="hide-menu">실시간 속보</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="main" aria-expanded="false">
                                <span>
                                    <i class="ti ti-alert-circle"></i>
                                </span>
                                <span class="hide-menu">주요 뉴스</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="stockinfo" aria-expanded="false">
                                <span>
                                    <i class="ti ti-cards"></i>
                                </span>
                                <span class="hide-menu">증권 정보</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="mypage" aria-expanded="false">
                                <span>
                                    <i class="ti ti-user"></i>
                                </span>
                                <span class="hide-menu">마이페이지</span>
                            </a>
                        </li>
                    </ul>

                </nav>
                <!-- End Sidebar navigation -->
            </div>
            <!-- End Sidebar scroll-->
        </aside>
        <!--  사이드바 끝-->
        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <header class="app-header">
                <nav class="navbar navbar-expand-lg navbar-light">
                    <ul class="navbar-nav">
                        <li class="nav-item d-block d-xl-none">
                            <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse"
                                href="javascript:void(0)">
                                <i class="ti ti-menu-2"></i>
                            </a>
                        </li>
                    </ul>
                    <!-- 검색창 -->
                    <div class="ms-3">
                        <form class="d-flex align-items-center me-auto" role="search" style="width: 600px;"
                            action="/search" method="GET">
                            <div class="input-group" style="width: 90%;">
                                <button class="btn border-0 shadow-none btn-lg" type="submit">
                                    <i class="ti ti-search text-dark"></i>
                                </button>
                                <input type="text" name="keyword"
                                    class="form-control border-0 shadow-none form-control-lg" placeholder="Search"
                                    aria-label="Search">
                            </div>
                        </form>
                    </div>
                    <!-- 프로필 클릭했을때 내려오는 아이들 -->
                    <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                        <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                            <li class="nav-item dropdown">
                                <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <img th:src="${session.loginMember?.profile_Img != null ? session.loginMember.profile_Img : '/assets/images/logos/profile.png'}"
                                        alt="" width="35" height="35" class="rounded-circle">
                                </a>
                                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                                    aria-labelledby="drop2">
                                    <div class="message-body">
                                        <a href="mypage" class="d-flex align-items-center gap-2 dropdown-item">
                                            <i class="ti ti-user fs-6"></i>
                                            <p class="mb-0 fs-3">My Page</p>
                                        </a>
                                        <!-- <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-mail fs-6"></i>
                      <p class="mb-0 fs-3">My Account</p>
                    </a>
                    <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-list-check fs-6"></i>
                      <p class="mb-0 fs-3">My Task</p>
                    </a> -->
                                        <a href="logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>
            </header>
            <!--  Header End -->
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <!-- 정렬 선택 -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;">홈</h5>
                </div>


                <!-- 카드 -------------------------------------------------------------------------------------------------------------------------->
                <div class="container mt-5">
                    <div class="row">
                        <!-- 워드 클라우드 -->
                        <div class="col-md-12 mb-3">
                            <div class="card" style="height: 400px;">
                                <div class="card-body">
                                    <h5 class="card-title fw-semibold mb-4">워드 클라우드</h5>
                                    <div id="wordcloud" style="width: 100%; height: 300px;"></div>
                                    <!-- 워드클라우드 렌더링 영역 -->
                                </div>
                            </div>
                        </div>

                        <div class="container mt-5">
                            <div class="row">
                                <!-- 주요 뉴스 -->
                                <div class="col-md-12 mb-3">
                                    <div class="card">
                                        <div class="card-body" style="min-height: 200px; height: auto;">
                                            <h5 class="card-title fw-semibold mb-4">주요 뉴스</h5>

                                            <div class="d-flex flex-wrap">
                                                <div class="d-flex flex-column w-50 p-2"
                                                    style="min-width: 300px; overflow: hidden;">
                                                    <p class="mb-2 text-truncate"
                                                        th:each="title, iterStat : ${newsTitles}" th:text="${title}"
                                                        th:if="${iterStat.index % 2 == 0}">
                                                    </p>
                                                </div>

                                                <div class="d-flex flex-column w-50 p-2"
                                                    style="min-width: 300px; overflow: hidden;">
                                                    <p class="mb-2 text-truncate"
                                                        th:each="title, iterStat : ${newsTitles}" th:text="${title}"
                                                        th:if="${iterStat.index % 2 == 1}">
                                                    </p>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>

                                <!-- 속보 뉴스 -->
                                <div class="col-md-12 mb-3">
                                    <div class="card">
                                        <div class="card-body" style="min-height: 200px; height: auto;">
                                            <h5 class="card-title fw-semibold mb-4">속보 뉴스</h5>

                                            <div class="d-flex flex-wrap">
                                                <div class="d-flex flex-column w-50 p-2"
                                                    style="min-width: 300px; overflow: hidden;">
                                                    <p class="mb-2 text-truncate"
                                                        th:each="title, iterStat : ${breakingNewsTitles}"
                                                        th:text="${title}" th:if="${iterStat.index % 2 == 0}">
                                                    </p>
                                                </div>

                                                <div class="d-flex flex-column w-50 p-2"
                                                    style="min-width: 300px; overflow: hidden;">
                                                    <p class="mb-2 text-truncate"
                                                        th:each="title, iterStat : ${breakingNewsTitles}"
                                                        th:text="${title}" th:if="${iterStat.index % 2 == 1}">
                                                    </p>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>



                    </div>
                </div>



            </div>

        </div>
    </div>
    </div>
    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="../assets/libs/apexcharts/dist/apexcharts.min.js"></script>
    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
    <script src="../assets/js/wordcloud.js"></script> <!-- 워드클라우드 JS 파일 추가 -->

    <script th:inline="javascript">
        // 서버에서 전달된 wordFreq 데이터를 가져옴
        const wordFrequencies = /*[[${wordFreq}]]*/ {};
        
        // 워드클라우드 렌더링 호출
        renderWordCloud(wordFrequencies, 'wordcloud');
    </script>
</body>

</html>
