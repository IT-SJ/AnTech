<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호찾기</title>
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
  <th:block th:insert="head :: head"></th:block>
</head>

<body>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-3">
            <div class="card mb-0">
              <div class="card-body">
                <a href="/" class="text-nowrap logo-img text-center d-block py-3 w-100">
                  <img src="../assets/images/logos/Logo1.svg" width="180" alt="">
                </a>

                <!-- 비밀번호 찾기 ---------------------------------------------->
                <form action="/findPw" method="post" id="findPasswordForm">
                  <h2><b>비밀번호 찾기 </b></h2>
                  <p class="fs-4 mb-0 fw-bold">이메일을 입력하고 비밀번호를 재설정하세요.</p>
                  <br>

                  <div class="mb-3">
                    <label for="exampleInputId1" class="form-label">아이디</label>
                    <input type="text" name="id" placeholder="아이디" class="form-control" id="InputId"
                      aria-describedby="textHelp">
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">이메일</label>
                    <div class="input-group">
                      <input type="email" name="email" placeholder="이메일" class="form-control rounded-2" id="InputEmail"
                        aria-describedby="emailHelp">
                      <button type="button" class="btn btn-primary ms-2 rounded-2" id="sendCodeButton">전송</button>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="exampleInputCode" class="form-label">인증번호</label>
                    <div class="input-group">
                      <input type="text" name="code" placeholder="인증번호 입력" class="form-control rounded-2" id="InputCode"
                        aria-describedby="codeHelp">
                      <button type="button" class="btn btn-primary ms-2 rounded-2" id="verifyCodeButton">인증</button>
                    </div>
                    <br>
                  </div>
                  <!-- 인증번호가 맞으면 새로운 비밀번호 입력뜨게------------->
                  <div class="mb-3" id="newPasswordSection" style="display: none;">
                    <input type="password" name="newPassword" placeholder="새로운 비밀번호" class="form-control"
                      id="InputNewPassword">
                  </div>
                  <br>
                  <div class="d-flex align-items-center justify-content-center">
                    <button type="submit" class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2">비밀번호 수정 완료</button>
                  </div>
                  <br>
                </form>
                <script>

                  // 인증 번호 요청
                  document.getElementById("sendCodeButton").addEventListener("click", function () {
                    const email = document.getElementById("InputEmail").value;
                    if (!email) {
                      alert("이메일을 입력해주세요.");
                      return;
                    }

                    fetch("/ans/sendCode", {
                      method: "POST",
                      headers: { "Content-Type": "application/x-www-form-urlencoded" },
                      body: `email=${email}`
                    })
                      .then(response => response.text())
                      .then(data => alert(data))
                      .catch(error => console.error("Error:", error));
                  });

                  // 인증 번호 확인
                  document.getElementById("verifyCodeButton").addEventListener("click", function () {
                    const email = document.getElementById("InputEmail").value;
                    const code = document.getElementById("InputCode").value;

                    if (!code) {
                      alert("인증번호를 입력해주세요.");
                      return;
                    }

                    fetch("/ans/verifyCode", {
                      method: "POST",
                      headers: { "Content-Type": "application/x-www-form-urlencoded" },
                      body: `email=${email}&code=${code}`
                    })
                      .then(response => response.text())
                      .then(data => {
                        if (data === "인증 성공") {
                          alert("이메일 인증이 완료되었습니다.");
                          document.getElementById("newPasswordSection").style.display = "block"; // 새 비밀번호 입력란 보이기
                        } else {
                          alert("인증번호가 일치하지 않습니다.");
                        }
                      })
                      .catch(error => console.error("Error:", error));
                  });

                  // 비밀번호 수정
                  document.getElementById("findPasswordForm").addEventListener("submit", function (event) {
                    event.preventDefault();

                    const id = document.getElementById("InputId").value;
                    const email = document.getElementById("InputEmail").value;
                    const newPassword = document.getElementById("InputNewPassword").value;

                    fetch("/ans/findPw", {
                      method: "POST",
                      headers: { "Content-Type": "application/x-www-form-urlencoded" },
                      body: `id=${id}&email=${email}&newPassword=${newPassword}`
                    })
                      .then(response => response.text())
                      .then(data => {
                        if (data === "비밀번호가 성공적으로 변경되었습니다.") {
                          alert(data);
                          window.location.href = "/login.do";
                        } else {
                          alert(data);
                        }
                      })
                      .catch(error => console.error("Error:", error));
                  });
                </script>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
