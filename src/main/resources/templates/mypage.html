<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>마이페이지</title>
    <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <th:block th:insert="head :: head"></th:block>
    <style>
        .text-truncate-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3; /* 최대 3줄까지 표시 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-wrap: break-word;
            max-height: 4.5em; /* 줄 간격 고려한 높이 */
        }
    </style>
</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 포함 -->
        <div th:replace="sidebar :: sidebar"></div>

        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <div th:replace="header :: header"></div>
            <!--  Header End -->
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <!-- 정렬 선택 -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;">마이페이지</h5>
                </div>


                <!-- 카드 -------------------------------------------------------------------------------------------------------------------------->
                <div class="row">
                    <!-- 내 정보 -->
                    <div class="profile">
                        <div class="card" style="height: 300px;">
                            <div class="position-relative rounded-top"
                                style="background-color: #D6EBFC; height: 200px;">
                            </div>
                            <div class="card-body pt-5 p-4">
                                <div class="d-flex align-items-center">
                                    <div style="margin-left: 170px;">
                                        <!-- 이미지 -->
                                        <div class="position-absolute bottom-0 start-0 mb-3 ms-4 rounded"
                                            style="width: 140px; height: 140px; background-color: white; display: flex; justify-content: center; align-items: center;">
                                            <img th:src="${session.loginMember?.profile_Img != null ? session.loginMember.profile_Img : '/assets/images/logos/profile.png'}"
                                                class="img-fluid rounded"
                                                style="width: 130px; height: 130px; object-fit: cover;">
                                        </div>

                                        <!-- 텍스트 -->
                                        <h6 class="fw-semibold fs-4 mb-2" id="loggedInUserId"
                                            th:text="${session.loginMember?.id}">내 아이디</h6>
                                        <p class="fw-semibold fs-3 mb-0">
                                            <i class="ti ti-mail"></i> <span
                                                th:text="${session.loginMember?.email}">이메일</span>
                                        </p>
                                    </div>
                                </div>

                                <!-- 버튼도 absolute위치로 함 -->
                                <button class="btn btn-primary position-absolute bottom-0 end-0 mb-4 me-4"
                                    data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                    수정하기
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- 프로필 수정 모달 --------------------------------------------------------------------------------------------------------->
                    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel"
                        aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="editProfileModalLabel">프로필 수정</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form id="editProfileForm">
                                        <!-- 프로필 사진 변경 -->
                                        <div class="mb-3 text-center">
                                            <input type="file" class="form-control" id="profileImageUpload"
                                                accept="image/*">
                                            <img id="previewImage"
                                                th:src="${session.loginMember?.profile_Img != null ? session.loginMember.profile_Img : '/assets/images/logos/profile.png'}"
                                                class="img-fluid rounded mt-2"
                                                style="width: 100px; height: 100px; object-fit: cover;">
                                        </div>

                                    </form>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-primary" id="saveProfileBtn">저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="container">
                        <h2></h2>

                        <div id="scrapNewsContainer" class="row">
                            <!-- 동적으로 스크랩한 뉴스 목록 추가 -->
                        </div>

                        <nav>
                            <ul id="paginationContainer" class="pagination justify-content-center">
                                <!-- 동적으로 페이지네이션 추가 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- 성진 마이프로필 수정-->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const profileImageUpload = document.getElementById("profileImageUpload");
            const previewImage = document.getElementById("previewImage");
            const saveProfileBtn = document.getElementById("saveProfileBtn");
            const loggedInUserId = document.getElementById("loggedInUserId").textContent;

            // 파일 선택 시 미리보기 변경
            profileImageUpload.addEventListener("change", function () {
                const file = profileImageUpload.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        previewImage.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 저장 버튼 클릭 시 프로필 업데이트
            saveProfileBtn.addEventListener("click", function () {
                const file = profileImageUpload.files[0];
                if (!file) {
                    alert("프로필 이미지를 선택해주세요.");
                    return;
                }

                const formData = new FormData();
                formData.append("profileImage", file);
                formData.append("userId", loggedInUserId); // 로그인한 사용자 ID
                $.ajax({
                    url: "/ans/profileupdate",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        console.log("프로필 업데이트 성공:", response);
                        alert("프로필이 업데이트되었습니다!");
                        // 모달 닫기
                        const modal = bootstrap.Modal.getInstance(document.getElementById("editProfileModal"));
                        modal.hide();
                        window.location.reload();
                    },
                    error: function (xhr, status, error) {
                        console.error("프로필 업데이트 실패:", error);
                        alert("프로필 업데이트에 실패했습니다.");
                    }
                });
            });
        });
    </script>

    <!-- 영빈 즐겨찾기 -->
    <script>

        const userId = "[[${session.loginMember.id}]]"; // 로그인 사용자 ID
        const newsContainer = document.getElementById("scrapNewsContainer");
        const paginationContainer = document.getElementById("paginationContainer");

        async function fetchScrapNews(page = 1) {
            try {
                const response = await fetch(`/ans/scrap-list?id=${encodeURIComponent(userId)}&page=${page}`);
                const data = await response.json();

                if (!data || !data.newsList || data.newsList.length === 0) {
                    newsContainer.innerHTML = "<p class='text-center'>스크랩한 뉴스가 없습니다.</p>";
                    return;
                }

                renderScrapNews(data.newsList);
                renderPagination(data.currentPage, data.totalPages);
            } catch (error) {
                console.error("스크랩 뉴스 목록 불러오기 실패:", error);
            }
        }

        function renderScrapNews(newsList) {
            newsContainer.innerHTML = "";

            newsList.forEach(news => {
                const newsCard = document.createElement("div");
                newsCard.classList.add("col-sm-6", "col-xl-4");

                newsCard.innerHTML = `
                    <div class="card ">
                        <div class="card-header d-flex justify-content-between py-1 px-2">
                            <button class="btn btn-outline-light ms-auto"
                                    data-idx="${news.idx}" onclick="toggleScrap(this)">
                                <i class="ti ti-star-filled" style="font-size: 1rem; color: gold;"></i>
                            </button>
                        </div>
                        <div class="card-body" style="min-height: 193px;">
                            <h5 class="card-title">
                                <p class="mb-1 badge rounded-pill bg-secondary-subtle text-secondary">${news.press}</p>
                                <a href="${news.type === 'breaking' ? '/Banalysis/' : '/analysis/'}${news.idx}" 
                                   class="text-decoration-none text-dark text-truncate-3">${news.title}</a>
                            </h5>
                            <p class="card-text fw-normal text-truncate" style="max-height: 3rem; overflow: hidden;">
                                ${news.smr}
                            </p>
                        </div>
                    </div>
                `;
                newsContainer.appendChild(newsCard);
            });
        }

        function renderPagination(currentPage, totalPages) {
            paginationContainer.innerHTML = "";
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                paginationContainer.innerHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link rounded-circle m-1" href="#" onclick="event.preventDefault(); fetchScrapNews(${i})">${i}</a>
                    </li>
                `;
            }
        }

        async function toggleScrap(button) {
            const idx = button.getAttribute("data-idx");
            const userId = "[[${session.loginMember.id}]]"; // 사용자 ID
            console.log("📌 스크랩 취소 요청 idx:", idx);

            if (!idx || idx === "null") {
                console.error("❌ 잘못된 idx 값:", idx);
                return;
            }

            try {
                const response = await fetch(`/ans/scrap/${idx}?id=${encodeURIComponent(userId)}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" }
                });

                const data = await response.json();
                console.log("📌 서버 응답 데이터:", data); // ✅ 서버 응답 확인

                if (data.success) { // ✅ 응답 키를 `success`로 변경
                    alert("스크랩이 취소되었습니다.");
                    button.closest(".card").remove(); // ✅ 버튼이 포함된 카드 즉시 제거

                    setTimeout(() => {
                        fetchScrapNews(1); // ✅ 목록 다시 불러오기
                    }, 300);
                } else {
                    alert("스크랩 취소 실패");
                }
            } catch (error) {
                console.error("스크랩 취소 실패:", error);
            }
        }

        fetchScrapNews(1);


        // ApexCharts 오류 실행 안시키기
        document.addEventListener("DOMContentLoaded", function () {
            const chartContainer = document.getElementById("userActivityChart");
            if (chartContainer) {
                var options = {
                    chart: { type: 'line' },
                    series: [{ name: '활동', data: [10, 15, 7, 20] }]
                };
                var chart = new ApexCharts(chartContainer, options);
                chart.render();
            }
        });
    </script>

    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="../assets/libs/apexcharts/dist/apexcharts.min.js"></script>
    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>



</body>

</html>
