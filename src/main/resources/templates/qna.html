<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Q&A</title>
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <th:block th:insert="head :: head"></th:block>
</head>

<body>
    <input type="hidden" id="userId" th:value="${session.loginMember?.id}">
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <div th:replace="sidebar :: sidebar"></div>

        <div class="body-wrapper">
            <div th:replace="header :: header"></div>
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">

                <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
                    <div class="card-body px-4 py-3">
                        <div class="row align-items-center">
                            <div class="col-md-4 col-xl-3">
                                <h4 class="fw-semibold mb-8">Q&A</h4>
                                <span>궁금한 것이 있다면 질문하세요</span>
                            </div>
                            <div
                                class="col-md-8 col-xl-9 text-end d-flex justify-content-md-end justify-content-center mt-3 mt-md-0">
                                <button type="button" id="btn-add-contact"
                                    class="btn btn-primary d-flex align-items-center" data-bs-toggle="modal"
                                    data-bs-target="#addContactModal">
                                    <i class="ti ti-users text-white me-1 fs-5"></i> 질문하기
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal -->
                <div class="modal fade" id="addContactModal" tabindex="-1" role="dialog"
                    aria-labelledby="addContactModalTitle" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered" role="document">
                        <div class="modal-content">
                            <div class="modal-header d-flex align-items-center">
                                <h5 class="modal-title">Question</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form id="addQnaForm" onsubmit="return false;">
                                    <div class="mb-3">
                                        <label class="form-label">제목</label>
                                        <input type="text" id="c-occupation" class="form-control"
                                            placeholder="제목을 입력하세요">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">내용</label>
                                        <textarea id="c-location" class="form-control"
                                            placeholder="내용을 입력하세요"></textarea>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button id="btn-add" class="btn btn-success">등록하기</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 질문 목록 -->
                <div class="card">
                    <div class="table-responsive border rounded">
                        <table class="table align-middle text-nowrap mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">번호</th>
                                    <th style="width: 35%;">질문</th>
                                    <th style="width: 40%;">내용</th>
                                    <th style="width: 15%;">시간</th>
                                </tr>
                            </thead>
                            <tbody id="qnaListBody">
                                <tr th:if="${#lists.isEmpty(qnaList)}">
                                    <td colspan="4" class="text-center">등록된 질문이 없습니다.</td>
                                </tr>
                                <tr th:each="qna, iterStat : ${qnaList}" th:if="${qna != null}"
                                    th:with="rowId=${qna != null ? (qna.idx != null ? qna.idx : iterStat.index) : iterStat.index}"
                                    data-bs-toggle="collapse" th:data-bs-target="'#row' + ${rowId}"
                                    aria-expanded="false" style="cursor: pointer;">
                                    <td th:text="${iterStat.count}"></td>
                                    <td th:text="${qna.title}"></td>
                                    <td th:text="${qna.text}"></td>
                                    <td th:text="${qna.dt}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // ✅ '질문하기' 버튼 및 모달 객체 가져오기
            const addContactButton = document.getElementById("btn-add-contact");
            const addContactModal = new bootstrap.Modal(document.getElementById("addContactModal"));
            const addQnaButton = document.getElementById("btn-add");
            const titleInput = document.getElementById("c-occupation");
            const textInput = document.getElementById("c-location");

            // ✅ '질문하기' 버튼 클릭 시 모달 표시
            addContactButton.addEventListener("click", function (event) {
                event.preventDefault(); // a 태그 기본 동작 방지 (스크롤 이동)
                addContactModal.show(); // 모달 표시
            });

            // ✅ '등록하기' 버튼 클릭 시 질문 등록 비동기 처리
            addQnaButton.addEventListener("click", async function () {
                const title = titleInput.value.trim();
                const text = textInput.value.trim();
                const id = document.getElementById("userId").value;

                // 제목과 내용이 비어있을 경우
                if (!title || !text) {
                    alert("제목과 내용을 입력해주세요!");
                    return;
                }

                try {
                    // 비동기 POST 요청으로 질문 데이터 전송
                    const response = await fetch("/ans/addQna", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title, text, id})
                    });

                    if (response.ok) {
                        alert("질문이 성공적으로 등록되었습니다!");
                        titleInput.value = ""; // 입력 필드 초기화
                        textInput.value = "";
                        addContactModal.hide(); // 모달 닫기
                        loadQnaList(); // 질문 목록 갱신 (필요 시)
                    } else {
                        alert("질문 등록에 실패했습니다.");
                    }
                } catch (error) {
                    console.error("❌ 질문 등록 실패:", error);
                }
            });
            // ✅ 질문 목록 갱신 함수 (필요시)
            async function loadQnaList() {
                try {
                    const response = await fetch("/ans/addQna");
                    const qnaList = await response.json();
                    const tableBody = document.getElementById("qnaListBody");
                    tableBody.innerHTML = "";

                    qnaList.forEach((qna, index) => {
                        const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${qna.title}</td>
                        <td>${qna.text}</td>
                        <td>${qna.dt}</td>
                    </tr>
                `;
                        tableBody.insertAdjacentHTML("beforeend", row);
                    });
                } catch (error) {
                    console.error("❌ 질문 목록 불러오기 실패:", error);
                }
            }
        });
    </script>

    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>



</body>

</html>
