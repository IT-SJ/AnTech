<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modernize Free</title>
    <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            width: 100%;
            height: 400px;
            /* 크기 증가 */
            max-height: 400px;
            overflow: hidden;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 포함 -->
        <div th:replace="sidebar :: sidebar"></div>

        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <div th:replace="header :: header"></div>
            <!--  Header End -->
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;">증권 정보</h5>
                </div>


                <!-- 증권 -------------------------------------------------------------------------------------------------------------------------->
                <div class="row">
                    <div class="row row-cols-1 row-cols-md-2">
                        <!-- 코스피 -->
                        <div class="col">
                            <div class="card">
                                <div class="card-body pt-3 p-4">
                                    <h6 class="card-title fw-semibold mb-4">코스피/코스닥</h6>
                                    <div class="chart-container">
                                        <canvas id="kospiKosdaqChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 나스닥/S&P 500 -->
                        <div class="col">
                            <div class="card">
                                <div class="card-body pt-3 p-4">
                                    <h6 class="card-title fw-semibold mb-4">나스닥/다우존스</h6>
                                    <div class="chart-container">
                                        <canvas id="nasdaqDowChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 환율 -->
                        <div class="col">
                            <div class="card">
                                <div class="card-body pt-3 p-4">
                                    <h6 class="card-title fw-semibold mb-4">환율</h6>
                                    <div id="exchangeRateText" style="font-size: 18px; font-weight: bold;">
                                        <!-- 환율 데이터가 여기에 업데이트됨 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 원자재 -->
                        <div class="col">
                            <div class="card">
                                <d class="card-body pt-3 p-4">
                                    <h6 class="card-title fw-semibold mb-4">원자재</h6>
                                    <div id="commoditiesText" style="font-size: 18px; font-weight: bold;">
                                        <!-- 원자재 데이터가 여기에 업데이트됨 -->
                                    </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 카드 끝 -->

        </div>
    </div>
    </div>
    </div>
    <!-- 스크립트 공간입니다 -------------------------------------------------------------------------------------------------------->
    <script>
        let stockChartInstances = {}; // 차트 인스턴스를 저장하는 객체

        /**
         * Yahoo Finance API에서 데이터를 가져와 Chart.js로 그래프를 그리는 함수
         * @param {string} apiUrl - 데이터를 가져올 API 엔드포인트
         * @param {string} chartId - 차트를 표시할 canvas 요소의 ID
         * @param {array} labels - 데이터셋 정보 (이름, 색상, 데이터 키)
         */
        async function fetchStockData(apiUrl, chartId, labels) {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data || !data.dates || data.dates.length === 0) {
                    console.error("데이터 가져오기 실패:", data.error || "No data received.");
                    return;
                }

                const ctx = document.getElementById(chartId);
                if (!ctx) {
                    console.error("Chart container not found:", chartId);
                    return;
                }

                // 기존 차트 삭제
                if (stockChartInstances[chartId]) {
                    stockChartInstances[chartId].destroy();
                }

                let datasets = labels.map((labelObj, index) => ({
                    label: labelObj.name,
                    data: data[labelObj.dataKey],
                    borderColor: labelObj.color,
                    backgroundColor: labelObj.bgColor,
                    borderWidth: 2,
                    tension: 0.1,
                    yAxisID: `y-axis-${index + 1}` // KOSPI & KOSDAQ을 개별 y축에 매핑
                }));

                stockChartInstances[chartId] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: formattedDates, // 수정된 날짜 적용
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                display: true,
                                title: { display: true, text: '날짜 (MM-DD)' }
                            },
                            "y-axis-1": {
                                position: "left",
                                title: { display: true, text: "KOSPI 지수" },
                                beginAtZero: false
                            },
                            "y-axis-2": {
                                position: "right",
                                title: { display: true, text: "KOSDAQ 지수" },
                                beginAtZero: false,
                                grid: { drawOnChartArea: false } // KOSPI & KOSDAQ 겹치는 문제 방지
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error fetching stock data:", error);
            }
        }


        // API 호출 (코스피 & 코스닥을 같은 차트에 표시)
        fetchStockData("/ans/kospi-kosdaq", "kospiKosdaqChart", [
            { name: "KOSPI", color: "#007FEE", bgColor: "#007FEE", dataKey: "kospi" },
            { name: "KOSDAQ", color: "#FC8B9F", bgColor: "#FC8B9F", dataKey: "kosdaq" }
        ]);
        // 여기서부터 환율 입니다 ----------------------------------------------------------------------------------------------------------------
        async function fetchExchangeRatesText() {
            try {
                console.log("Fetching exchange rates...");
                const response = await fetch("/ans/exchange-rates");
                const data = await response.json();

                if (!data || data.error) {
                    document.getElementById("exchangeRateText").innerText = "환율 데이터를 불러올 수 없습니다.";
                    return;
                }

                let exchangeRateHTML = "";
                for (const [country, values] of Object.entries(data)) {
                    let changeColor = values.change > 0 ? "red" : "#007FEE";
                    let changeSymbol = values.change > 0 ? "▲" : "▼";

                    exchangeRateHTML += `
                <p style="font-size: 16px; margin: 5px 0;">
                    <strong>${values.name}</strong>: 
                    <span style="font-weight: bold;">${values.currentRate.toFixed(2)} KRW</span> 
                    <span style="color: ${changeColor}; font-weight: bold;">
                        ${changeSymbol} ${Math.abs(values.change.toFixed(2))} (${values.changePercent.toFixed(2)}%)
                    </span>
                </p>`;
                }

                document.getElementById("exchangeRateText").innerHTML = exchangeRateHTML;
            } catch (error) {
                console.error("Error fetching exchange rates:", error);
                document.getElementById("exchangeRateText").innerText = "데이터를 가져오는 중 오류 발생";
            }
        }

        // 환율 텍스트 데이터 가져오기
        fetchExchangeRatesText();


        // 여기서부터 나스닥 입니다---------------------------------------------------------------------------
        async function fetchStockData(apiUrl, chartId, labels) {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data || !data.dates || data.dates.length === 0) {
                    console.error("데이터 가져오기 실패:", data.error || "No data received.");
                    return;
                }

                const ctx = document.getElementById(chartId);
                if (!ctx) {
                    console.error("Chart container not found:", chartId);
                    return;
                }

                // 기존 차트 삭제
                if (stockChartInstances[chartId]) {
                    stockChartInstances[chartId].destroy();
                }

                let datasets = labels.map((labelObj, index) => ({
                    label: labelObj.name,
                    data: data[labelObj.dataKey],
                    borderColor: labelObj.color,
                    backgroundColor: labelObj.bgColor,
                    borderWidth: 3,
                    tension: 0.1,
                    yAxisID: `y-axis-${index + 1}`
                }));

                stockChartInstances[chartId] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.dates,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                display: true,
                                title: { display: true, text: '날짜' }
                            },
                            "y-axis-1": {
                                position: "left",
                                title: { display: true, text: "NASDAQ 지수" },
                                beginAtZero: false
                            },
                            "y-axis-2": {
                                position: "right",
                                title: { display: true, text: "DOW JONES 지수" },
                                beginAtZero: false,
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error fetching stock data:", error);
            }
        }

        // 나스닥 & 다우 차트 적용
        fetchStockData("/ans/nasdaq-dow", "nasdaqDowChart", [
            { name: "NASDAQ", color: "#007FEE", bgColor: "#007FEE", dataKey: "nasdaq" },
            { name: "DOW JONES", color: "#FC8B9F", bgColor: "#FC8B9F", dataKey: "dow" }
        ]);

        //원자재
        async function fetchCommoditiesText() {
            try {
                console.log("Fetching commodities data...");
                const response = await fetch("/ans/commodities");
                const data = await response.json();

                if (!data || data.error) {
                    document.getElementById("commoditiesText").innerText = "원자재 데이터를 불러올 수 없습니다.";
                    return;
                }

                let commoditiesHTML = "";
                for (const [commodity, values] of Object.entries(data)) {
                    let changeColor = values.change > 0 ? "red" : "#007FEE";
                    let changeSymbol = values.change > 0 ? "▲" : "▼";

                    commoditiesHTML += `
                <p style="font-size: 16px; margin: 5px 0;">
                    <strong>${values.name}</strong>: 
                    <span style="font-weight: bold;">${values.currentPrice.toFixed(2)} USD</span> 
                    <span style="color: ${changeColor}; font-weight: bold;">
                        ${changeSymbol} ${Math.abs(values.change.toFixed(2))} (${values.changePercent.toFixed(2)}%)
                    </span>
                </p>`;
                }

                document.getElementById("commoditiesText").innerHTML = commoditiesHTML;
            } catch (error) {
                console.error("Error fetching commodities data:", error);
                document.getElementById("commoditiesText").innerText = "데이터를 가져오는 중 오류 발생";
            }
        }

        // 원자재 텍스트 데이터 가져오기
        fetchCommoditiesText();


    </script>
    <!-- 차트 띠우는 스크립트 끝 ------------------------------------------------------------------------------------>

    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>

</html>
