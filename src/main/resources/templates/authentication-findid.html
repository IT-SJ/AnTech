<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아이디찾기</title>
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
  <th:block th:insert="head :: head"></th:block>
</head>

<body>
  <!-- 숨겨진 알림 메시지 -->
  <div th:if="${findIdError}" id="findIdErrorMessage" th:text="${findIdError}" style="display: none;"></div>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-3">
            <div class="card mb-0">
              <div class="card-body">
                <a href="/" class="text-nowrap logo-img text-center d-block py-3 w-100">
                  <img src="../assets/images/logos/Logo1.svg" width="180" alt="">
                </a>
                <br>
                <!-- 아이디 찾기 -->
                <form action="findId" method="post">
                  <div class="mb-3">
                    <h2><b>아이디 찾기</b></h2>
                    <p class="fs-4 mb-0 fw-bold">이메일을 입력하고 아이디를 찾으세요.</p>
                    <br><br>
                    <label for="exampleInputEmail1" class="form-label">이메일</label>
                    <input type="email" name="email" placeholder="이메일" class="form-control" id="InputEmail"
                      aria-describedby="emailHelp">
                  </div>
                  <br>
                  <button type="submit" class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2">이메일 확인</button>
                  <div class="d-flex align-items-center justify-content-center">
                    <a class="text-primary fw-bold ms-2" href="/login.do">
                      로그인</a>
                  </div>
                  <br>
                </form>
                <script>
                  document.querySelector("button[type='submit']").addEventListener("click", function (event) {
                    const emailInput = document.querySelector("#InputEmail");
                    if (!emailInput.value) {
                      alert("이메일을 입력해주세요.");
                      event.preventDefault();
                    }
                  });
                </script>
                <script>
                  // DOMContentLoaded 이벤트가 발생했을 때 실행
                  document.addEventListener("DOMContentLoaded", function () {
                    // 메시지가 서버에서 렌더링된 경우만 표시
                    const findIdError = document.getElementById("findIdErrorMessage");
                    if (findIdError) {
                      alert(findIdError.textContent); // 메시지 내용을 알림창으로 표시
                    }
                  });
                </script>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
