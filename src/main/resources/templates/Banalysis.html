<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modernize Free</title>
    <link rel="shortcut icon" type="image/png" href="/src/main/resources/static/assets/images/logos/favicon.png" />
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}">
    <th:block th:insert="head :: head"></th:block>

</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 포함 -->
        <div th:replace="sidebar :: sidebar"></div>

        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <div th:replace="header :: header"></div>
            <!--  헤더 끝 ------------------------------------------------------------------------------------------------------------------------------------>
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <!-- 정렬 선택 -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;">속보 뉴스 분석</h5>
                    <input type="hidden" id="type" value="breaking">
                    <!-- 스크랩 버튼 -->
                    <button id="scrapButton" class="btn btn-outline-primary"
                        th:text="${scrapped != null and scrapped} ? '스크랩 취소' : '스크랩'" th:data-idx="${news.idx}"
                        th:data-id="${session.loginMember != null ? session.loginMember.id : ''}"
                        onclick="toggleScrap(this)">
                    </button>
                </div>

                <!--  첫번째 줄 -->
                <!-- 카드 -------------------------------------------------------------------------------------------------------------------------->
                <div class="row">
                    <!-- 왼쪽 큰 카드 -->
                    <div class="col-md-6">
                        <div class="card overflow-hidden rounded-2" style="min-height: 630px; height: auto;">
                            <div class="position-relative mb-4">
                                <a href="javascript:void(0)">
                                    <img th:if="${news.img_url1 != null and news.img_url1 != ''}"
                                        th:src="${news.img_url1}"
                                        class="card-img-top rounded-0 border border-5 border-white"
                                        style="object-fit: cover; height: 300px; width: 100%;">
                                    <img th:if="${news.img_url1 == null or news.img_url1 == ''}"
                                        th:src="@{/assets/images/logo/Frame.svg}"
                                        class="card-img-top rounded border border-5 border-white"
                                        style="object-fit: cover; height: 300px; width: 100%;">
                                </a>
                            </div>
                            <div class="card-body pt-3 p-4">
                                <h5 class="fw-semibold" th:text="${news.title}">뉴스기사 제목</h5>
                                <div>
                                    <h5 class="fw-normal mb-2 fs-4" style="color:rgb(95, 95, 95)" th:text="${news.smr}">
                                        뉴스요약
                                    </h5>
                                </div>
                                <!-- 해시태그 영역 -->
                                <div class="d-flex flex-wrap gap-3 mb-2 ">
                                    <!-- 실시간 뉴스 해시태그 -->
                                    <h5 th:each="hashtag : ${breakingHashtags}" th:text="${hashtag}" class="fw-bold"
                                        style="color: blue; cursor: pointer;" onclick="searchByHashtag(this)">
                                    </h5>
                                </div>
                                <div class="d-flex justify-content-center mt-3">
                                    <a th:href="${news.url}" class="btn btn-outline-primary w-100" target="_blank">뉴스 원문
                                        보기</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽 위아래 두 개 카드 -->
                    <div class="col-md-6">
                        <div class="row">
                            <!-- 첫 번째 작은 카드 -->
                            <div class="col-12">
                                <div class="card overflow-hidden rounded-2" style="height: 300px;">
                                    <div class="card-body">
                                        <h6 class="fw-semibold fs-4">관련 기사</h6>
                                        <ul>
                                            <li th:each="news : ${relatedNews}">
                                                <a th:href="@{${news.idx < 10000 ? '/analysis/' : '/Banalysis/'} + ${news.idx}}"
                                                    class="text-decoration-none text-dark">
                                                    <span th:text="${news.title}"></span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <!-- 두 번째 작은 카드 -->
                            <div class="col-12">
                                <div class="card overflow-hidden rounded-2" style="height: 300px;">
                                    <div class="card-body">
                                        <h6 class="fw-semibold fs-4">감정 분석</h6>
                                        <div style="width: 250px; height: 250px; margin: auto;">
                                            <canvas id="sentimentChart"></canvas>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>



                <!-- Row 끝 --------------------------------------------------------------------->
            </div>
        </div>
    </div>

    <!-- 영빈 즐찾-->

    <script>
        const idx = "[[${news.idx}]]";
        const id = "[[${session.loginMember.id}]]";
        const type = "[[${type}]]"; // ✅ 메인 or 속보 자동 판별
        const scrapButton = document.getElementById("scrapButton");

        async function toggleScrap(button) {
            try {

                if (!button) {
                    console.error("스크랩 버튼을 찾을 수 없습니다!");
                    return;
                }
                const isScrapped = scrapButton.textContent === "스크랩 취소";
                const method = isScrapped ? "DELETE" : "POST";

                const idx = button.getAttribute("data-idx");
                const id = button.getAttribute("data-id");
                const type = document.getElementById("type").value; // ✅ type 값 읽기

                if (!idx || !id) {
                    console.error("idx 또는 id가 없습니다!", idx, id);
                    return;
                }

                console.log("스크랩 요청:", { method, idx, id, type });

                const response = await fetch(`/ans/scrap/${idx}?id=${id}&type=${type}`, {
                    method: method,
                    headers: { "Content-Type": "application/json" }
                });

                const data = await response.json();
                button.textContent = data.scrapped ? "스크랩 취소" : "스크랩";
            } catch (error) {
                console.error("스크랩 토글 실패:", error);
            }
        }
    </script>

    <!--영빈 감정분석 차트-->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            try {
                // ✅ JSON 데이터를 안전하게 파싱
                const sentimentData = JSON.parse('[[${sentiment}]]'.replace(/&quot;/g, '"'));

                console.log("📌 감정 분석 데이터:", sentimentData);

                // ✅ 감정 분석 결과 확인
                if (sentimentData) {
                    console.log("📌 감정 분석 결과:", sentimentData);

                    // ✅ 긍정/부정 점수 가져오기 (중립 제거)
                    let positive = sentimentData.positive || 0;
                    let negative = sentimentData.negative || 0;

                    // ✅ 값이 0일 경우 기본값 설정하여 모든 감정이 표시되도록 보정
                    let total = positive + negative;
                    if (total === 0) {
                        positive = 50.0;
                        negative = 50.0;
                    }

                    // ✅ Chart.js를 이용한 원형 차트 생성 (중립 제거)
                    var ctx = document.getElementById('sentimentChart').getContext('2d');
                    var sentimentChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: ['긍정', '부정'],
                            datasets: [{
                                data: [positive, negative],
                                backgroundColor: ['#4CAF50', '#F44336']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,  // ✅ 비율 유지
                            aspectRatio: 1,             // ✅ 원형 비율 조절
                            layout: {
                                padding: {
                                    left: 10,
                                    right: 10,
                                    top: 10,
                                    bottom: 10
                                }
                            },
                            plugins: {
                                legend: {
                                    position: 'top', // ✅ 범례 위치 조정
                                    labels: {
                                        boxWidth: 15,  // ✅ 범례 크기 조정
                                        font: {
                                            size: 14     // ✅ 글자 크기 조정
                                        }
                                    }
                                },
                                tooltip: {
                                    enabled: true, // ✅ 툴팁 활성화
                                }
                            }
                        },
                        plugins: [{
                            id: 'centerText',
                            beforeDraw: function (chart) {
                                let ctx = chart.ctx;
                                ctx.textAlign = "center"; // ✅ 가운데 정렬
                                ctx.textBaseline = "middle"; // ✅ 중앙 정렬
                                ctx.font = "16px Arial"; // ✅ 폰트 설정
                                ctx.fillStyle = "#000"; // ✅ 글자 색상

                                let dataset = chart.data.datasets[0].data;
                                let labels = chart.data.labels;
                                let total = dataset.reduce((acc, val) => acc + val, 0);

                                dataset.forEach((value, i) => {
                                    let percentage = ((value / total) * 100).toFixed(1);
                                    let text = `${labels[i]} ${percentage}%`;

                                    let meta = chart.getDatasetMeta(0);
                                    let element = meta.data[i];

                                    let x = element.tooltipPosition().x;
                                    let y = element.tooltipPosition().y;

                                    ctx.fillText(text, x, y);
                                });
                            }
                        }]
                    });
                } else {
                    console.error("❌ 감정 분석 데이터가 존재하지 않습니다.");
                }
            } catch (error) {
                console.error("❌ 감정 분석 데이터 변환 실패:", error);
            }
        });
    </script>

    <!-- 영빈 해시태그 검색페이지 이동 -->
    <script>
        function searchByHashtag(element) {
            let hashtag = element.innerText.trim(); // ✅ 해시태그 텍스트 가져오기
            let keyword = hashtag.startsWith("#") ? hashtag.substring(1) : hashtag; // ✅ '#' 제거
            window.location.href = `/search?keyword=` + encodeURIComponent(keyword); // ✅ 검색 페이지로 이동
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:src="@{/assets/libs/jquery/dist/jquery.min.js}"></script>
    <script th:src="@{/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/assets/js/sidebarmenu.js}"></script>
    <script th:src="@{/assets/js/app.min.js}"></script>
    <script th:src="@{/assets/libs/apexcharts/dist/apexcharts.min.js}"></script>
    <script th:src="@{/assets/libs/simplebar/dist/simplebar.js}"></script>
    <script th:src="@{/assets/js/dashboard.js}"></script>

</body>

</html>
