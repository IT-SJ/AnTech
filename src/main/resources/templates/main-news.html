<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modernize Free</title>
    <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 시작 -->
        <aside class="left-sidebar">
            <!-- Sidebar scroll-->
            <div>
                <div class="brand-logo d-flex align-items-center justify-content-between">
                    <a href="home" class="text-nowrap logo-img">
                        <img src="../assets/images/logos/Logo1.svg" width="180" alt="" />
                    </a>
                    <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
                        <i class="ti ti-x fs-8"></i>
                    </div>
                </div>
                <!-- Sidebar navigation-->
                <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
                    <ul id="sidebarnav">
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="home" aria-expanded="false">
                                <span>
                                    <i class="ti ti-layout-dashboard"></i>
                                </span>
                                <span class="hide-menu">Home</span>
                            </a>
                        </li>
                        <li class="nav-small-cap">
                            <i class="ti ti-dots nav-small-cap-icon fs-4"></i>
                            <span class="hide-menu">pages</span>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="breaking" aria-expanded="false">
                                <span>
                                    <i class="ti ti-article"></i>
                                </span>
                                <span class="hide-menu">실시간 속보</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="main" aria-expanded="false">
                                <span>
                                    <i class="ti ti-alert-circle"></i>
                                </span>
                                <span class="hide-menu">주요 뉴스</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="stockinfo" aria-expanded="false">
                                <span>
                                    <i class="ti ti-cards"></i>
                                </span>
                                <span class="hide-menu">증권 정보</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="mypage" aria-expanded="false">
                                <span>
                                    <i class="ti ti-user"></i>
                                </span>
                                <span class="hide-menu">마이페이지</span>
                            </a>
                        </li>
                    </ul>

                </nav>
                <!-- End Sidebar navigation -->
            </div>
            <!-- End Sidebar scroll-->
        </aside>
        <!--  사이드바 끝-->
        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <header class="app-header">
                <nav class="navbar navbar-expand-lg navbar-light">
                    <ul class="navbar-nav">
                        <li class="nav-item d-block d-xl-none">
                            <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse"
                                href="javascript:void(0)">
                                <i class="ti ti-menu-2"></i>
                            </a>
                        </li>
                    </ul>
                    <!-- 검색창 -->
                    <div class="ms-3">
                        <form class="d-flex align-items-center me-auto" role="search" style="width: 600px;">
                            <!-- 너비 증가 -->
                            <div class="input-group" style="width: 90%;"> <!-- 내부 요소도 키우기 -->
                                <button class="btn border-0 shadow-none btn-lg" type="submit"> <!-- 버튼 크기 증가 -->
                                    <i class="ti ti-search text-dark"></i>
                                </button>
                                <input type="text" class="form-control border-0 shadow-none form-control-lg"
                                    placeholder="Search" aria-label="Search"> <!-- 입력창 크기 증가 -->
                            </div>
                        </form>
                    </div>

                    <!-- 프로필 클릭했을때 내려오는 아이들 -->
                    <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                        <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                            <li class="nav-item dropdown">
                                <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <img src="../assets/images/profile/user-1.jpg" alt="" width="35" height="35"
                                        class="rounded-circle">
                                </a>
                                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                                    aria-labelledby="drop2">
                                    <div class="message-body">
                                        <a href="mypage" class="d-flex align-items-center gap-2 dropdown-item">
                                            <i class="ti ti-user fs-6"></i>
                                            <p class="mb-0 fs-3">My Page</p>
                                        </a>
                                        <!-- <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-mail fs-6"></i>
                      <p class="mb-0 fs-3">My Account</p>
                    </a>
                    <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-list-check fs-6"></i>
                      <p class="mb-0 fs-3">My Task</p>
                    </a> -->
                                        <a href="logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>
            </header>
            <!--  Header End -->
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <!-- 정렬 선택 -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;">주요 뉴스</h5>
                    <select class="form-select mb-0" aria-label="뉴스 정렬 옵션" style="width: 200px;">
                        <option value="1">최신순</option>
                        <option value="2">인기순</option>
                    </select>
                </div>

                <!-- 카드 -------------------------------------------------------------------------------------------------------------------------->
                <div class="row">
                    <!-- 뉴스 카드 반복 렌더링 -->
                    <div class="col-sm-6 col-xl-4" th:each="news : ${newsList}">
                        <div class="card overflow-hidden rounded-2 ">
                            <div class="position-relative">
                                <a th:href="${news.url}" target="_blank">
                                    <!-- 뉴스 이미지가 있을 경우 -->
                                    <img th:if="${news.img_url1 != null and news.img_url1 != ''}"
                                        th:src="${news.img_url1}" class="card-img-top rounded border border-5 border-white"
                                        style="height: 180px; object-fit: cover;">

                                    <!-- 뉴스 이미지가 없을 경우 기본 이미지 표시 -->
                                    <img th:if="${news.img_url1 == null or news.img_url1 == ''}"
                                        src="../assets/images/logo/Frame.svg" class="card-img-top rounded border border-5 border-white"
                                        style="height: 180px; object-fit: cover;">
                                </a>
                            </div>
                            <div class="card-body pt-3 p-4 d-flex flex-column align-items-stretch"
                                style="min-height: 180px;">
                                <!-- 타이틀 (최대 3줄 허용, 줄바꿈 가능) -->
                                <h6 class="fw-semibold fs-4 flex-grow-1" th:text="${news.title}">
                                    뉴스기사 제목
                                </h6>

                                <!-- 신문사 정보 -->
                                <div class="d-flex align-items-center justify-content-between">
                                    <h6 class="fw-light fs-4 mb-2" th:text="${news.press}">신문사</h6>
                                </div>

                                <!-- 버튼 (항상 하단 고정) -->
                                <div class="d-flex justify-content-center mt-auto">
                                    <a th:href="analysis" class="btn btn-outline-primary w-100" th:attr="data-id=${news.idx}" 
                                    onclick="moveToAnalysis(this)">뉴스 분석
                                        보기</a>
                                </div>
                            </div>


                        </div>
                    </div>


                    <!-- 페이지네이션 -->
                    <div class="container mt-2">
                        <nav th:if="${totalPages > 1}"> <!-- 페이지가 1개 이상일 때만 표시 -->
                            <ul class="pagination justify-content-center p-0 m-0" style="gap: 10px;">

                                <!-- "이전" 버튼 -->
                                <li class="page-item" th:if="${currentPage > 1}">
                                    <a class="page-link rounded-circle"
                                        th:href="@{/main?page={prev}(prev=${currentPage - 1})}">«</a>
                                </li>

                                <!-- 페이지네이션: 최대 5개만 표시 -->
                                <li class="page-item" th:each="i : ${#numbers.sequence(
                                            (currentPage - 2 > 1 ? currentPage - 2 : 1),
                                            (currentPage + 2 < totalPages ? currentPage + 2 : totalPages)
                                        )}">
                                    <a class="page-link rounded-circle" th:href="@{/main?page={num}(num=${i})}"
                                        th:text="${i}" th:classappend="${i == currentPage} ? 'active' : ''">
                                    </a>
                                </li>

                                <!-- "다음" 버튼 -->
                                <li class="page-item" th:if="${currentPage < totalPages}">
                                    <a class="page-link rounded-circle"
                                        th:href="@{/main?page={next}(next=${currentPage + 1})}">»</a>
                                </li>

                            </ul>
                        </nav>
                    </div>

                </div>
                <!-- row끝  -->
            </div>
        </div>
    </div>
    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="../assets/libs/apexcharts/dist/apexcharts.min.js"></script>
    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script>
        function moveToAnalysis(button) {
            let newsId = button.getAttribute("data-id"); // 뉴스 ID 가져오기
            window.location.href = "/analysis/" + newsId; // 현재 창에서 이동
        }
        </script>
</body>

</html>
