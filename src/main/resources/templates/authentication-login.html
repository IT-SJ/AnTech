<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modernize Free</title>
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
</head>

<body>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-3">
            <div class="card mb-0">
              <div class="card-body">
                <a href="/" class="text-nowrap logo-img text-center d-block py-3 w-100">
                  <img src="../assets/images/logos/Logo1.svg" width="180" alt="">
                </a>
                <!-- 로그인 ---------------------------------------------------->
                <form action="login.do" method="post" id="loginForm">
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">아이디</label>
                    <input type="text" name="id" placeholder="아이디" class="form-control" id="exampleInputEmail1">
                    <div th:if="${loginError}" class="text-danger mt-2">
                      <span th:text="${loginError}"></span>
                    </div>                    
                  </div>
                  <div class="mb-4">
                    <label for="exampleInputPassword1" class="form-label">비밀번호</label>
                    <input type="password" name="pw" placeholder="비밀번호" class="form-control" id="exampleInputPassword1">
                  </div>
                  <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                      <input class="form-check-input primary" type="checkbox" name="remeberId" value="true"
                        id="flexCheckChecked" checked>
                      <label class="form-check-label text-dark" for="flexCheckChecked">
                        아이디 저장
                      </label>
                    </div>
                    <div class="link-container">
                      <a href="/findid">아이디 / </a>
                      <a href="/findpw">비밀번호 찾기</a>
                    </div>

                  </div>
                  <button type="button" id="loginButton" class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2">로그인</button>
                  <div class="d-flex align-items-center justify-content-center">
                    <p class="fs-4 mb-0 fw-bold">ANSight 계정이 없다면?</p>
                    <a class="text-primary fw-bold ms-2" href="/register">회원가입 하기</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // 로그인 버튼 클릭 이벤트
    document.getElementById('loginButton').addEventListener('click', function () {
      const id = document.getElementById('exampleInputEmail1').value.trim();
      const pw = document.getElementById('exampleInputPassword1').value.trim();

      // 아이디와 비밀번호가 비어 있으면 알림 창 띄움
      if (!id || !pw) {
        alert('아이디와 비밀번호를 입력해주세요.');
        return;
      }

      // 입력값이 모두 존재하면 폼 제출
      document.getElementById('loginForm').submit();
    });
  </script>
  <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
