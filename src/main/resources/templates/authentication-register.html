<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modernize Free</title>
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
</head>

<body>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-3">
            <div class="card mb-0">
              <div class="card-body">
                <a href="소개페이지로 연결" class="text-nowrap logo-img text-center d-block py-3 w-100">
                  <img src="../assets/images/logos/Logo.png" width="180" alt="">
                </a>
                <!-- 회원가입 ------------------------------------------------->
                <form action="register.do" method="post">
                  <div class="mb-3">
                    <label for="exampleInputId1" class="form-label">아이디</label>
                    <div class="input-group">
                      <input type="text" name="id" placeholder="아이디" class="form-control rounded-2" id="Inputid" aria-describedby="textHelp">
                      <button type="submit" class="btn btn-primary btn-sm ms-2 rounded-2 w-auto">중복확인</button>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">비밀번호</label>
                    <input type="password" name="pw" placeholder="비밀번호" class="form-control" id="InputPassword1">
                  </div>
                  
                  <div class="mb-3">
                    <label for="exampleInputPassword2" class="form-label">비밀번호 확인</label>
                    <input type="password" placeholder="비밀번호 확인" class="form-control" id="InputPassword2">
                  </div>
                  <div class="mb-4">
                    <label for="exampleInputEmail1" class="form-label">이메일</label>
                    <input type="email" name="email" placeholder="이메일" class="form-control" id="InputEmail" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputCode" class="form-label">인증번호</label>
                    <div class="input-group">
                      <input type="text" placeholder="인증번호 입력" class="form-control rounded-2" id="InputCode"
                        aria-describedby="codeHelp">
                      <button type="submit" class="btn btn-primary ms-2 rounded-2">입력</button>
                    </div>
                    <br>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 py-8 fs-4 mb-4 rounded-2">회원가입 완료</button>
                          <div class="d-flex align-items-center justify-content-center">
                    <p class="fs-4 mb-0 fw-bold">계정이 이미 있으신가요?</p>
                    <a class="text-primary fw-bold ms-2" href="./authentication-login.html">로그인</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
