<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modernize Free</title>
    <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}">

</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 시작 -->
        <aside class="left-sidebar">
            <!-- Sidebar scroll-->
            <div>
                <div class="brand-logo d-flex align-items-center justify-content-between">
                    <a href="home" class="text-nowrap logo-img">
                        <img src="../assets/images/logos/Logo1.svg" width="180" alt="" />
                    </a>
                    <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
                        <i class="ti ti-x fs-8"></i>
                    </div>
                </div>
                <!-- Sidebar navigation-->
                <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
                    <ul id="sidebarnav">
                        <li class="sidebar-item">
                            <a class="sidebar-link" th:href="@{/home}" aria-expanded="false">
                                <span>
                                    <i class="ti ti-layout-dashboard"></i>
                                </span>
                                <span class="hide-menu">Home</span>
                            </a>
                        </li>
                        <li class="nav-small-cap">
                            <i class="ti ti-dots nav-small-cap-icon fs-4"></i>
                            <span class="hide-menu">Pages</span>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" th:href="@{/breaking}" aria-expanded="false">
                                <span>
                                    <i class="ti ti-article"></i>
                                </span>
                                <span class="hide-menu">실시간 속보</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" th:href="@{/main}" aria-expanded="false">
                                <span>
                                    <i class="ti ti-alert-circle"></i>
                                </span>
                                <span class="hide-menu">주요 뉴스</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" th:href="@{/stockinfo}" aria-expanded="false">
                                <span>
                                    <i class="ti ti-cards"></i>
                                </span>
                                <span class="hide-menu">증권 정보</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" th:href="@{/mypage}" aria-expanded="false">
                                <span>
                                    <i class="ti ti-user"></i>
                                </span>
                                <span class="hide-menu">마이페이지</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- End Sidebar navigation -->
            </div>
            <!-- End Sidebar scroll-->
        </aside>
        <!--  사이드바 끝  ------------------------------------------------------------------------------------>
        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <header class="app-header">
                <nav class="navbar navbar-expand-lg navbar-light">
                    <ul class="navbar-nav">
                        <li class="nav-item d-block d-xl-none">
                            <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse"
                                href="javascript:void(0)">
                                <i class="ti ti-menu-2"></i>
                            </a>
                        </li>
                    </ul>
                    <!-- 검색창 -->
                    <div class="ms-3">
                        <form class="d-flex align-items-center me-auto" role="search" style="width: 600px;">
                            <!-- 너비 증가 -->
                            <div class="input-group" style="width: 90%;"> <!-- 내부 요소도 키우기 -->
                                <button class="btn border-0 shadow-none btn-lg" type="submit"> <!-- 버튼 크기 증가 -->
                                    <i class="ti ti-search text-dark"></i>
                                </button>
                                <input type="text" class="form-control border-0 shadow-none form-control-lg"
                                    placeholder="Search" aria-label="Search"> <!-- 입력창 크기 증가 -->
                            </div>
                        </form>
                    </div>

                    <!-- 프로필 클릭했을때 내려오는 아이들 -->
                    <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                        <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                            <li class="nav-item dropdown">
                                <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <img src="../assets/images/profile/user-1.jpg" alt="" width="35" height="35"
                                        class="rounded-circle">
                                </a>
                                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                                    aria-labelledby="drop2">
                                    <div class="message-body">
                                        <a href="javascript:void(0)"
                                            class="d-flex align-items-center gap-2 dropdown-item">
                                            <i class="ti ti-user fs-6"></i>
                                            <p class="mb-0 fs-3">My Page</p>
                                        </a>
                                        <!-- <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-mail fs-6"></i>
                      <p class="mb-0 fs-3">My Account</p>
                    </a>
                    <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-list-check fs-6"></i>
                      <p class="mb-0 fs-3">My Task</p>
                    </a> -->
                                        <a href="logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>
            </header>
            <!--  헤더 끝 ------------------------------------------------------------------------------------------------------------------------------------>
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <!-- 정렬 선택 -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;"
                        th:text="${type == 'breaking' ? '속보 뉴스 분석' : '주요 뉴스 분석'}">주요 뉴스 분석</h5>
                    <!-- 스크랩 버튼 -->
                    <button id="scrapButton" class="btn btn-outline-primary" th:text="${scrapped != null and scrapped} ? '스크랩 취소' : '스크랩'"
                        th:data-type="${type}" th:data-idx="${news.idx}" onclick="toggleScrap()">
                    </button>
                </div>

                <!--  첫번째 줄 -->
                <!-- 카드 -------------------------------------------------------------------------------------------------------------------------->
                <div class="row">
                    <!-- 왼쪽 큰 카드 -->
                    <div class="col-md-6">
                        <div class="card overflow-hidden rounded-2" style="min-height: 630px; height: auto;">
                            <div class="position-relative mb-4">
                                <a href="javascript:void(0)">
                                    <img th:if="${news.img_url1 != null and news.img_url1 != ''}"
                                        th:src="${news.img_url1}"
                                        class="card-img-top rounded-0 border border-5 border-white"
                                        style="object-fit: cover; height: 300px; width: 100%;">
                                    <img th:if="${news.img_url1 == null or news.img_url1 == ''}"
                                        th:src="@{/assets/images/logo/Frame.svg}"
                                        class="card-img-top rounded border border-5 border-white"
                                        style="object-fit: cover; height: 300px; width: 100%;">
                                </a>
                            </div>
                            <div class="card-body pt-3 p-4">
                                <h5 class="fw-semibold" th:text="${news.title}">뉴스기사 제목</h5>
                                <div>
                                    <h5 class="fw-normal mb-2 fs-4" style="color:rgb(95, 95, 95)" th:text="${news.smr}">
                                        뉴스요약
                                    </h5>
                                </div>
                                <!-- 해시태그 영역 -->
                                <div class="d-flex flex-wrap gap-3 mb-2 ">
                                    <h5 class="fw-bold" style="color: red; ">#빨강태그</h5>
                                    <h5 class="fw-bold" style="color: blue; ">#파랑태그</h5>
                                    <h5 class="fw-bold" style="color: black;">#검정태그</h5>
                                </div>
                                <div class="d-flex justify-content-center mt-3">
                                    <a th:href="${news.url}" class="btn btn-outline-primary w-100" target="_blank">뉴스 원문
                                        보기</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽 위아래 두 개 카드 -->
                    <div class="col-md-6">
                        <div class="row">
                            <!-- 첫 번째 작은 카드 -->
                            <div class="col-12">
                                <div class="card overflow-hidden rounded-2" style="height: 300px;">
                                    <div class="card-body">
                                        <h6 class="fw-semibold fs-4">관련 주</h6>

                                    </div>
                                </div>
                            </div>
                            <!-- 두 번째 작은 카드 -->
                            <div class="col-12">
                                <div class="card overflow-hidden rounded-2" style="height: 300px;">
                                    <div class="card-body">
                                        <h6 class="fw-semibold fs-4">감정 분석</h6>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>



                <!-- Row 끝 --------------------------------------------------------------------->
            </div>
        </div>
    </div>

    <!-- 영빈 즐찾-->

    <script>
        const type = "[[${type}]]";
        const idx = "[[${news.idx}]]";
        const id = "[[${session.loginMember.id}]]"; // 서버에서 로그인된 사용자 ID 가져오기
        const scrapButton = document.getElementById("scrapButton");
    
        async function checkScrapStatus() {
            try {
                const response = await fetch(`/ans/${type}/${idx}?id=${id}`);
                const data = await response.json();
                scrapButton.textContent = data.scrapped ? "스크랩 취소" : "스크랩";
            } catch (error) {
                console.error("스크랩 상태 확인 실패:", error);
            }
        }
    
        async function toggleScrap() {
            try {
                const isScrapped = scrapButton.textContent === "스크랩 취소";
                const method = isScrapped ? "DELETE" : "POST";
    
                const response = await fetch(`/ans/${type}/${idx}?id=${id}`, {
                    method: method,
                    headers: { "Content-Type": "application/json" }
                });
    
                const data = await response.json();
                scrapButton.textContent = data.scrapped ? "스크랩 취소" : "스크랩";
            } catch (error) {
                console.error("스크랩 토글 실패:", error);
            }
        }
    
        checkScrapStatus();
    </script>

    <script>
        const idd = "[[${news.idx}]]"; // idx 값 확인
        console.log("News IDX:", idd);
    </script>


    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="../assets/libs/apexcharts/dist/apexcharts.min.js"></script>
    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>

</html>
