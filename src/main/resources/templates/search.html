<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${keyword + ' : ANSight 검색'}"></title>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}" />
    <th:block th:insert="head :: head"></th:block>
</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">
        <!-- 사이드바 포함 -->
        <div th:replace="sidebar :: sidebar"></div>
        <!--  Main wrapper -->
        <div class="body-wrapper">
            <!--  헤더 시작 -->
            <div th:replace="header :: header"></div>
            <!--  Header End -->
            <div class="container-fluid" style="padding-left: 6rem; padding-right: 6rem;">
                <!-- 정렬 선택 -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <!-- 검색 결과 타이틀 -->
                    <h5 class="card-title fw-semibold mb-0" style="font-size: 20px; color: #007FEE;">
                        "<span th:text="${keyword}"></span>"에 대한 검색 결과
                    </h5>
                    <select class="form-select mb-0" aria-label="뉴스 정렬 옵션" style="width: 200px;">
                        <option value="1">최신순</option>
                        <option value="2">인기순</option>
                    </select>
                </div>

                <!--  첫번째 줄 -->
                <!-- 카드 -------------------------------------------------------------------------------------------------------------------------->
                <div class="row">
                    <!-- 뉴스 카드 반복 렌더링 -->
                    <div class="col-sm-6 col-xl-4" th:each="news : ${newsList}">
                        <div class="card overflow-hidden rounded-2 ">
                            <div class="position-relative">
                                <!-- 뉴스 이미지가 있을 경우 -->
                                <img th:if="${news.img_url1 != null and news.img_url1 != ''}" th:src="${news.img_url1}"
                                    class="card-img-top p-2"
                                    style="height: 150px; object-fit: cover; border-radius: 18px !important;">

                                <!-- 뉴스 이미지가 없을 경우 기본 이미지 표시 -->
                                <img th:if="${news.img_url1 == null or news.img_url1 == ''}"
                                    src="../assets/images/logo/Frame.svg"
                                    class="card-img-top p-2"
                                    style="height: 150px; object-fit: cover; border-radius: 18px !important;">
                            </div>
                            <div class="card-body p-3 d-flex flex-column align-items-stretch pt-2"
                                style="min-height: 163px;">
                                
                                <!-- 신문사 정보 -->
                                <div class="mb-1">
                                    <h6 class="mb-1 badge rounded-pill bg-secondary-subtle text-secondary" th:text="${news.press}">신문사</h6>
                                    <!-- 타이틀 (최대 3줄 허용, 줄바꿈 가능) -->
                                    <h6 class="fw-semibold fs-4 flex-grow-1" th:text="${news.title}">
                                        뉴스기사 제목
                                    </h6>
                                </div>

                                <!-- 버튼 (항상 하단 고정) -->
                                <div class="d-flex justify-content-center mt-auto">
                                    <a th:href="@{${news.idx < 10000 ? '/analysis/' : '/Banalysis/'} + ${news.idx}}"
                                        class="btn btn-outline-primary w-100">뉴스 분석
                                        보기</a>
                                </div>
                            </div>


                        </div>
                    </div>


                    <!-- 페이지네이션 -->
                    <div class="container mt-2">
                        <nav th:if="${totalPages > 1}"> <!-- 페이지가 1개 이상일 때만 표시 -->
                            <ul class="pagination justify-content-center p-0 m-0" style="gap: 10px;">

                                <!-- "이전" 버튼 -->
                                <li class="page-item" th:if="${currentPage > 1}">
                                    <a class="page-link rounded-circle"
                                        th:href="@{/search(keyword=${keyword}, page=${currentPage - 1})}">«</a>
                                </li>

                                <!-- 페이지네이션: 최대 5개만 표시 -->
                                <li class="page-item" th:each="i : ${#numbers.sequence(
                                            (currentPage - 2 > 1 ? currentPage - 2 : 1),
                                            (currentPage + 2 < totalPages ? currentPage + 2 : totalPages)
                                        )}">
                                    <a class="page-link rounded-circle"
                                        th:href="@{/search(keyword=${keyword}, page=${i})}" th:text="${i}"
                                        th:classappend="${i == currentPage} ? 'active' : ''">
                                    </a>
                                </li>

                                <!-- "다음" 버튼 -->
                                <li class="page-item" th:if="${currentPage < totalPages}">
                                    <a class="page-link rounded-circle"
                                        th:href="@{/search(keyword=${keyword}, page=${currentPage + 1})}">»</a>
                                </li>

                            </ul>
                        </nav>
                    </div>

                </div>
                <!-- row끝  -->

            </div>
        </div>
    </div>
    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="../assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>

</html>
